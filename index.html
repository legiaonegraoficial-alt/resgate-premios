<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Legião Negra - Resgate de Prêmios</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:radial-gradient(circle at top,#350000,#120000,#000000);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.container{

width:380px;

background:#0b0b0b;

border:2px solid #a50000;

border-radius:20px;

padding:30px;

box-shadow:0 0 30px rgba(255,0,0,.5);

}

.logo{

display:block;

margin:auto;

width:170px;

margin-bottom:20px;

}

h1{

text-align:center;

color:#ff2222;

margin-bottom:25px;

text-shadow:0 0 15px red;

}

input,select{

width:100%;

padding:15px;

margin-bottom:15px;

background:#151515;

border:1px solid #700000;

border-radius:10px;

color:white;

font-size:16px;

}

input:focus,
select:focus{

border-color:red;

box-shadow:0 0 12px red;

outline:none;

}

button{

width:100%;

padding:16px;

background:#444;

border:none;

border-radius:10px;

font-size:18px;

font-weight:bold;

color:white;

transition:.3s;

cursor:pointer;

}

button:enabled{

background:linear-gradient(#ff0000,#8b0000);

box-shadow:0 0 20px red;

}

button:disabled{

cursor:not-allowed;

opacity:.6;

}

footer{

margin-top:20px;

text-align:center;

color:#777;

font-size:12px;

}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>RESGATE DE PRÊMIOS</h1>

<input

type="tel"

id="codigo"

placeholder="Código do prêmio"

inputmode="numeric"

pattern="[0-9]*"

maxlength="12"

oninput="this.value=this.value.replace(/\D/g,'');verificarCampos()">

<input

type="text"

id="nick"

placeholder="Seu Nick"

oninput="verificarCampos()">

<select

id="servidor"

onchange="verificarCampos()">

<option value="">Selecione o servidor</option>

<option value="Servidor 1">Servidor 1</option>

<option value="Servidor 2">Servidor 2</option>

</select>

<button

id="btn"

onclick="enviar()"

disabled>

RESGATAR

</button>

<footer>

Legião Negra • By Spectro

</footer>

</div>

<script>

function verificarCampos(){

let codigo=document.getElementById("codigo").value;

let nick=document.getElementById("nick").value;

let servidor=document.getElementById("servidor").value;

document.getElementById("btn").disabled=!(codigo&&nick&&servidor);

}

function enviar(){

let codigo=document.getElementById("codigo").value;

let nick=document.getElementById("nick").value;

let servidor=document.getElementById("servidor").value;

let texto=

"🎁 *NOVO RESGATE*%0A%0A"+

"🔢 Código: "+codigo+"%0A"+

"👤 Nick: "+nick+"%0A"+

"🌍 "+servidor;

window.open("https://wa.me/5511976718538?text="+texto,"_blank");

}

</script>

</body>
</html>
